[project]
name = "chatbi"
version = "0.1.0"
description = "ChatBI: conversational business intelligence application"
readme = "README.md"
authors = [
    { name = "guoxiaojie", email = "809839581@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.24.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
chatbi = "chatbi:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
